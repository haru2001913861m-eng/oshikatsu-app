<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推し活家計簿</title>
<meta name="description" content="推しに会い続けるための家計簿。推し活費を先に守る予算にして、当落から逆算して積み立てる。">
<meta name="theme-color" content="#FFE3EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="推し活家計簿">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <div class="brand">
      <img src="assets/emoji/ticket.png" alt="" class="brand-em">
      <div>
        <div class="brand-sub" id="brandSub">推しに会い続けるための</div>
        <div class="brand-name">推し活家計簿</div>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="設定">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1l.4 2.6h4l.4-2.6c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6Z"/></svg>
    </button>
  </header>

  <main id="main" class="main"></main>

  <nav class="tabs" id="tabs" aria-label="メニュー">
    <button data-tab="home" class="tab on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
    <button data-tab="cal" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>カレンダー</span></button>
    <button class="fab" id="fab" aria-label="記録する"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="goals" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.5a2.5 2.5 0 0 0 0 5V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.5a2.5 2.5 0 0 0 0-5Z"/><path d="M10 9v6" stroke-dasharray="1.5 2"/></svg><span>積立</span></button>
    <button data-tab="sum" class="tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>まとめ</span></button>
  </nav>
</div>

<div id="sheetLayer" class="sheet-layer" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>
<div id="screenLayer" class="screen-layer" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="fx" class="fx" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
